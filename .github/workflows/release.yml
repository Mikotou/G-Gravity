name: Release Gravity (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to current ref, e.g. v0.3.5)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        env:
          GRAVITY_REQUIRE_DIST: '1'
        run: npm test

      - name: Package Windows portable executable
        run: npx electron-builder --win portable --publish never

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          Get-Item release\Gravity.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/Gravity.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        env:
          GRAVITY_REQUIRE_DIST: '1'
        run: npm test

      - name: Package macOS arm64 & x64 (DMG + ZIP)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Verify macOS artifacts
        run: |
          ls -lh release/*.dmg release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v ]]; then
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG_NAME#v}"
          cat <<EOF > release-notes.md
          ## Gravity ${TAG_NAME}（Windows x64 & macOS Apple Silicon / Intel）

          面向 Google Antigravity (\`agy\`) 的本地桌面智能编码工作台——100% 遵循官方公开 \`agy acp\` 协议，零私密接口、零凭据触碰、零账号轮换。

          ### 下载选择
          - **Windows 10 / 11 (x64)**：\`Gravity.exe\`（单文件便携版，双击即用）
          - **macOS Apple Silicon (M1 / M2 / M3 / M4)**：\`Gravity-${VERSION}-mac-arm64.dmg\`（或 \`.zip\`）
          - **macOS Intel (x64)**：\`Gravity-${VERSION}-mac-x64.dmg\`（或 \`.zip\`）

          > **首次启动提示（开源未签名包）**
          > - **Windows**：若 SmartScreen 弹窗拦截，点击「更多信息」→「仍要运行」。
          > - **macOS**：首次打开若提示“已损坏”或“无法验证开发者”，拖入「应用程序」后在终端执行一次：\`xattr -cr /Applications/Gravity.app\` 即可正常打开。
          > - **前置条件**：请先在本机安装并登录官方原版 \`agy\` CLI（终端运行 \`agy --version\` 正常可用）。

          ### 本版亮点（v0.3.5）
          - **OKLCH 双轴热力图与 7d 按日柱状图重构**：统一 24h / 7d / 30d 三视图的「绝对用量 × 窗口占比」双轴强度模型与 6 套预设 / 自定义主题 OKLCH 5 阶色阶（100% WCAG AA 对比度达标）；`7d` 全面升级为按日柱状图，复用与 `24h` 一致的左侧 Token 用量 Y 轴刻度（峰值 / 半值 / 0）与虚线网格并在下方对齐 7 日横轴（窄栏自动切单字星期 0 溢出）；`30d` 升级为 Mon–Sun Codex 周行方格，全面覆盖主 Context、外部复核与外部翻译三账本。
          - **Plan 多题提问卡 v2 与只读 Plan 检视器**：支持多题编号解析、题号步进器、每项右上角小铅笔就地编辑、卡片内「自定义回答」扩展框与多题统一提交（交互过程 0 IPC，原生表单支持幂等回执与安全普通消息跟进）；右侧 `Plan` 页签支持 6 态权威待办、历史重放不丢计划、以及受控只读 128 KiB `implementation_plan.md` 预览（0 外链图片、0 写入 `~/.gemini`），无待办但计划文档就绪时不再显示矛盾空态。
          - **审批体验与界面全面降噪**：移除“突发保护已开启/解除”等无用或冗余瞬态提示及胶囊闪烁点；命中账号安全底线（`tier_a_immutable`）且附带外部 AI 复核时，红框明确说明具体命中项及“不受 AI 评分与意图放行”，下方 AI 横幅清晰标示为「AI 风险参考（仅辅助人工）」并去除重复前缀，消除低分仍需审批的困惑。
          - **工作台精简、分支稳定性与跨端加固**：修复历史 `layout.json` 遗留字段导致的分支修订/切换报错，补全回滚同步与分支树自愈；完成 TopBar / 设置 8 导航 / 外观 3 子页 / 检视器折叠与零非合成属性动效收口；强化 `AP-1`（API Key 显式点击发现）、`PL-1`（插件零被动 CLI 刷新与隔离 Profile 提示）、`AQ-1`（429/403 冷却窗暂停探测倒计时）、`B01`（标题会话迟到关闭释槽）与 macOS APFS `realpathSync.native` / 大小写 / NFC-NFD / 2x Retina 原生 SF 字体适配。
          - **Windows + macOS 双端全量验收**：通过四端 `typecheck` 0 错、`src/main`（107 文件）与 `src/shared` 0 循环依赖、81/81 IPC 1:1 守卫、0 死 CSS 类守卫、Windows x64（1,240 项）与 macOS Apple Silicon ARM64（1,237 项）全量 Vitest 0 failed、Playwright 布局回归 0px 跳变、6 主题 × 4 宽度 2x Retina 视觉 E2E、以及双端打包实机冒烟（`~/.gemini` 严格零写入）。
          EOF

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "Gravity ${TAG_NAME}" --notes-file release-notes.md
            gh release upload "${TAG_NAME}" release-artifacts/* --clobber
          else
            gh release create "${TAG_NAME}" release-artifacts/* --title "Gravity ${TAG_NAME}" --notes-file release-notes.md
          fi
