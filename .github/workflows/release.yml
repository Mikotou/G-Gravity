name: Release Gravity (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to current ref, e.g. v0.3.6)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        env:
          GRAVITY_REQUIRE_DIST: '1'
        run: npm test

      - name: Fetch and verify offline voice model
        run: npm run voice:model:fetch

      - name: Package Windows portable executable
        run: npx electron-builder --win portable --publish never

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          Get-Item release\Gravity.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/Gravity.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        env:
          GRAVITY_REQUIRE_DIST: '1'
        run: npm test

      - name: Fetch and verify offline voice model
        run: npm run voice:model:fetch

      - name: Package macOS arm64 & x64 (DMG + ZIP)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Verify macOS artifacts
        run: |
          ls -lh release/*.dmg release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v ]]; then
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG_NAME#v}"
          cat <<EOF > release-notes.md
          ## Gravity ${TAG_NAME}（Windows x64 & macOS Apple Silicon / Intel）

          面向 Google Antigravity (\`agy\`) 的本地桌面智能编码工作台——100% 遵循官方公开 \`agy acp\` 协议，零私密接口、零凭据触碰、零账号轮换。

          ### 下载选择
          - **Windows 10 / 11 (x64)**：\`Gravity.exe\`（单文件便携版，双击即用）
          - **macOS Apple Silicon (M1 / M2 / M3 / M4)**：\`Gravity-${VERSION}-mac-arm64.dmg\`（或 \`.zip\`）
          - **macOS Intel (x64)**：\`Gravity-${VERSION}-mac-x64.dmg\`（或 \`.zip\`）

          > **首次启动提示（开源未签名包）**
          > - **Windows**：若 SmartScreen 弹窗拦截，点击「更多信息」→「仍要运行」。
          > - **macOS**：首次打开若提示“已损坏”或“无法验证开发者”，拖入「应用程序」后在终端执行一次：\`xattr -cr /Applications/Gravity.app\` 即可正常打开。
          > - **前置条件**：请先在本机安装并登录官方原版 \`agy\` CLI（终端运行 \`agy --version\` 正常可用）。

          ### 本版亮点（v0.3.6）
          - **100% 合规语音听写（本地离线 Whisper WASM + 可选外部 API）**：支持 `F5`（macOS `fn F5`）、`/voice`、`/record` 与底栏麦克风按钮启动，随包内嵌经 SHA-256 强校验的离线多语模型 `ggml-base-q5_1.bin` 与主进程 `worker_threads` 纯 WASM 引擎（下载即断网可用，渲染层保持 `script-src 'self'` 零放宽）；支持 OpenAI 兼容与 Gemini Developer API 外部转写（独立 `SecretVault` 加密、独立 429/403 熔断与独立时长账本）；双权限 Handler 静息恒拒绝、仅有效短时音频租约放行纯音频；`Enter`/`F5`/3:30 停录保留绝不自动发送，`Esc` 精确回滚未编辑听写区间。
          - **划词引用与批注全链路成对保序**：统一有序 `annotations[]`（`ann-<UUID>` + `originMessageId`），点「引用」聚焦该条独立批注框并支持「仅引用」、编号批注钉悬停高亮、旧草稿无缝迁移与发送失败按 ID 原序合并恢复；已发送气泡呈现独立编号配对卡片与分隔线「补充说明」，编辑表单卡片在上、正文在下且支持旧历史手工迁移。
          - **Plan 四态实时时间线与严格会话私有隔离**：彻底移除跨会话同目录 `workspace-reference` 自动认领与历史扫描，自动 Plan 仅只读当前 Profile 自有会话 `brain/<sessionId>/implementation_plan.md`（131,072 B 物理读前硬上限、双根歧义拒绝、摘要/原文分视图独立修订号）；右侧 Plan 页签实现纯空态（DOM 零文件栏）、文档概要态（中性大纲无假百分比 + 按需抽屉折叠 Mermaid）、实时执行态（6 态时间线与 ≥3 已完成自动折叠）及显式清空态，正文内联 Todo 精简为最新消息单行 Plan chip。
          - **后端精简与客户端/插件全量缺陷闭环**：`src/shared/` 拆瘦至 23 文件全 ≤ 650 行零环、`src/main/` 维持 5 层 0 环与 93/93 IPC 通道 1:1 对齐；落地 4 步可回退退出状态机（Windows 末窗保存失败可安全重试不死窗）、空闲 Swarm Worker 重建、MCP `--env` 密钥全量脱敏、可见 `session/new` 孤儿回收、403/429 冷却保序、首次 `session/load` 暂存防漏与 `U1–U6`/`B1–B17` 全套 UI/无障碍/窄窗格 `+` 溢出修复。
          EOF

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "Gravity ${TAG_NAME}" --notes-file release-notes.md
            gh release upload "${TAG_NAME}" release-artifacts/* --clobber
          else
            gh release create "${TAG_NAME}" release-artifacts/* --title "Gravity ${TAG_NAME}" --notes-file release-notes.md
          fi
