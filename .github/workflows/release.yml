name: Release Gravity (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to current ref, e.g. v0.2.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package Windows portable executable
        run: npx electron-builder --win portable --publish never

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          Get-Item release\Gravity.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/Gravity.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package macOS arm64 & x64 (DMG + ZIP)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.build.electronDist; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Verify macOS artifacts
        run: |
          ls -lh release/*.dmg release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v ]]; then
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG_NAME#v}"
          cat <<EOF > release-notes.md
          ## Gravity ${TAG_NAME}（Windows x64 & macOS Apple Silicon / Intel）

          面向 Google Antigravity (\`agy\`) 的本地桌面智能编码工作台——100% 遵循官方公开 \`agy acp\` 协议，零私密接口、零凭据触碰、零账号轮换。

          ### 下载选择
          - **Windows 10 / 11 (x64)**：\`Gravity.exe\`（单文件便携版，双击即用）
          - **macOS Apple Silicon (M1 / M2 / M3 / M4)**：\`Gravity-${VERSION}-mac-arm64.dmg\`（或 \`.zip\`）
          - **macOS Intel (x64)**：\`Gravity-${VERSION}-mac-x64.dmg\`（或 \`.zip\`）

          > **首次启动提示（开源未签名包）**
          > - **Windows**：若 SmartScreen 弹窗拦截，点击「更多信息」→「仍要运行」。
          > - **macOS**：首次打开若提示“已损坏”或“无法验证开发者”，拖入「应用程序」后在终端执行一次：\`xattr -cr /Applications/Gravity.app\` 即可正常打开。
          > - **前置条件**：请先在本机安装并登录官方原版 \`agy\` CLI（终端运行 \`agy --version\` 正常可用）。

          ### 本版亮点
          - **外部复核服务端模型发现与灵活参数**：填入公开 API Key（或切换本机 Ollama）后自动/手动查询服务端允许的模型列表与思考强度（\`auto / off / minimal / low / medium / high\`），默认 \`timeoutMs = 8000\`、\`maxOutputTokens = 4096\`、\`cacheTtlHours = 24\`；自动适配 Gemini 3/4 \`thinkingLevel\` 与 Gemini 2.5 \`thinkingBudget\`，支持 \`MAX_TOKENS\` 截断与真实错误透传。
          - **Approve for me 全链路重构与严格连接门控**：修复 MCP / 文档检索工具被误标为 \`other\` / 高风险终端命令的问题，只读文档/网络/MCP 检索 0ms 放行并防 SSRF；非只读 MCP 工具支持会话前缀记忆与外部模型复核；开启外部复核后支持只读 PowerShell 分析脚本复审并尊重 \`accept-edits\` 工作区编辑；严格门控仅在正常连接外部复核后方可开启「AI 代审」，否则自动回落基础规则机制并引导连接。
          - **外部复核多 API Provider 用量与花费统计**：实时提取 Google AI Studio / OpenAI 兼容接口 / 本机 Ollama 返回的真实 Token 用量（多服务商共同累计，本地 Ollama 自动计费 \$0），在 \`Approve for me\` 菜单与右侧 \`Context\` 检视器双视图（「Context 窗口 ↔ 外部复核统计」）完整呈现客户端累计、当前会话、\`24h / 7d / 30d\` 分布及分服务商费用构成。
          - **跨版本更新与重启配置无损保留**：外部复核 API Key 通过操作系统级加密（Windows DPAPI / macOS 钥匙串）独立存于 \`reviewer-secret.enc\`（明文不落盘），自定义配色、审批规则、布局悬浮态、输入框高度、思考默认折叠与窗口位置均配合 \`.bak\` 影子备份在更新后自动保留。
          - **右侧检视器窄宽横向滑动栏**：压缩右侧栏宽度时，顶部页签栏自动呈现细横向滚动条与左右滑动按钮，并支持鼠标滚轮横滑，随时轻松点选 \`Terminal\`、\`Context\` 与 \`Swarm\`。
          EOF

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "Gravity ${TAG_NAME}" --notes-file release-notes.md
            gh release upload "${TAG_NAME}" release-artifacts/* --clobber
          else
            gh release create "${TAG_NAME}" release-artifacts/* --title "Gravity ${TAG_NAME}" --notes-file release-notes.md
          fi
